name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Patch Swift Tools Version
        run: |
          # Fetch and cache SPM dependencies first
          xcodebuild -resolvePackageDependencies -project OpenVision.xcodeproj -scheme OpenVision || true
          
          # Downgrade swift-tools-version in any cached mlx-swift packages to match Swift 6.1
          find ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData -name "Package.swift" -path "*mlx-swift*" -exec sed -i '' 's/swift-tools-version: 6.3/swift-tools-version: 6.1/g' {} + 2>/dev/null || true
          find . -name "Package.swift" -path "*mlx-swift*" -exec sed -i '' 's/swift-tools-version: 6.3/swift-tools-version: 6.1/g' {} + 2>/dev/null || true

      - name: Build App
        run: |
          xcodebuild \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/OpenVision.app build/Payload/
          cd build && zip -r OpenVision.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-IPA
          path: build/OpenVision.ipa
