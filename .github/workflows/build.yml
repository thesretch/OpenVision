name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:

      # ============================================================
      # CHECK OUT SOURCE
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Generate Config.xcconfig run: | cp Config.xcconfig.example Config.xcconfig echo "Config.xcconfig created from example template"

      # ============================================================
      # SELECT XCODE
      # ============================================================

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app

          echo ""
          echo "Selecting Xcode 26.5..."

          sudo xcode-select -s /Applications/Xcode_26.5.app

          echo ""
          echo "Selected Xcode:"
          xcode-select -p


      # ============================================================
      # SHOW BUILD ENVIRONMENT
      # ============================================================

      - name: Show Versions
        run: |
          echo "======================================"
          echo "XCODE VERSION"
          echo "======================================"

          xcodebuild -version

          echo ""
          echo "======================================"
          echo "SWIFT VERSION"
          echo "======================================"

          swift --version

          echo ""
          echo "======================================"
          echo "SDK VERSION"
          echo "======================================"

          xcrun --sdk iphoneos --show-sdk-version

          echo ""
          echo "======================================"
          echo "XCODE PATH"
          echo "======================================"

          xcode-select -p


      # ============================================================
      # DISABLE CI TRUST VALIDATION
      # ============================================================

      - name: Configure Swift Package Validation
        run: |
          echo "Configuring Xcode for non-interactive CI builds..."

          defaults write com.apple.dt.Xcode \
            IDESkipMacroFingerprintValidation \
            -bool YES

          echo "Macro fingerprint validation disabled."


      # ============================================================
      # RESOLVE SWIFT PACKAGES
      # ============================================================

      - name: Resolve Package Dependencies
        run: |
          set -e

          echo "======================================"
          echo "RESOLVING PACKAGE DEPENDENCIES"
          echo "======================================"

          xcodebuild \
            -resolvePackageDependencies \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -skipPackagePluginValidation \
            -skipMacroValidation

          echo ""
          echo "Package resolution completed."


      # ============================================================
      # BUILD APPLICATION
      # ============================================================

      - name: Build App
        run: |
          set -e

          echo "======================================"
          echo "BUILDING OPENVISION"
          echo "======================================"

          rm -rf build

          mkdir -p build

          xcodebuild \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

          echo ""
          echo "======================================"
          echo "XCODE BUILD FINISHED"
          echo "======================================"


      # ============================================================
      # FIND THE APP
      # ============================================================

      - name: Locate Built App
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR OPENVISION.APP"
          echo "======================================"

          find build/DerivedData \
            -name "OpenVision.app" \
            -type d \
            -print

          APP_PATH=$(find build/DerivedData \
            -name "OpenVision.app" \
            -type d \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "ERROR: OpenVision.app was not found."
            exit 1
          fi

          echo ""
          echo "Found application:"
          echo "$APP_PATH"

          echo "$APP_PATH" > build/app_path.txt


      # ============================================================
      # PACKAGE IPA
      # ============================================================

      - name: Package IPA
        run: |
          set -e

          echo "======================================"
          echo "PACKAGING IPA"
          echo "======================================"

          APP_PATH=$(cat build/app_path.txt)

          echo "Application:"
          echo "$APP_PATH"

          rm -rf build/Payload

          mkdir -p build/Payload

          cp -R \
            "$APP_PATH" \
            build/Payload/OpenVision.app

          cd build

          rm -f OpenVision.ipa

          zip -r OpenVision.ipa Payload

          echo ""
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh OpenVision.ipa


      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-IPA
          path: build/OpenVision.ipa
          if-no-files-found: error


      # ============================================================
      # FINISH
      # ============================================================

      - name: Complete
        run: |
          echo ""
          echo "======================================"
          echo "BUILD COMPLETE"
          echo "======================================"

          echo "OpenVision.ipa was successfully created."

          echo ""
          echo "IPA:"
          ls -lh build/OpenVision.ipa
