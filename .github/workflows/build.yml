- name: Patch Swift Tools Version
  run: |
    # Resolve dependencies so SwiftPM downloads the packages
    xcodebuild -resolvePackageDependencies \
      -project OpenVision.xcodeproj \
      -scheme OpenVision || true

    echo "Searching for kokoro-ios Package.swift files..."

    find ~/Library/Caches/org.swift.swiftpm \
         ~/Library/Developer/Xcode/DerivedData \
         . \
         -path "*kokoro-ios*/Package.swift" \
         -exec sed -i '' \
         's/swift-tools-version: 6\.2/swift-tools-version: 6.1/g' {} + \
         2>/dev/null || true

    echo "Checking what was found:"
    find ~/Library/Caches/org.swift.swiftpm \
         ~/Library/Developer/Xcode/DerivedData \
         . \
         -path "*kokoro-ios*/Package.swift" \
         -print 2>/dev/null || true
