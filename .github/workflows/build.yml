name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Show Versions
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo ""
          echo "=== Swift ==="
          swift --version
          echo ""
          echo "=== Available Xcode Versions ==="
          ls -d /Applications/Xcode*.app

      - name: Resolve Package Dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project OpenVision.xcodeproj \
            -scheme OpenVision

      - name: Build App
        run: |
          xcodebuild \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/OpenVision.app build/Payload/
          cd build
          zip -r OpenVision.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-IPA
          path: build/OpenVision.ipa
