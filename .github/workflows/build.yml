name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Show Versions
        run: |
          echo "======================================"
          echo "XCODE VERSION"
          echo "======================================"
          xcodebuild -version

          echo ""
          echo "======================================"
          echo "SWIFT VERSION"
          echo "======================================"
          swift --version

          echo ""
          echo "======================================"
          echo "AVAILABLE XCODE VERSIONS"
          echo "======================================"
          ls -d /Applications/Xcode*.app

      - name: Trust Swift Package Plugins
        run: |
          echo "Disabling package plugin validation for CI..."

          defaults write com.apple.dt.Xcode \
            IDESkipPackagePluginFingerprintValidatation \
            -bool YES

          echo "Disabling macro validation for CI..."

          defaults write com.apple.dt.Xcode \
            IDESkipMacroFingerprintValidation \
            -bool YES

      - name: Resolve Package Dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Build App
        run: |
          xcodebuild \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Check Built App
        run: |
          echo "======================================"
          echo "CHECKING BUILD OUTPUT"
          echo "======================================"

          if [ -d "build/Release-iphoneos/OpenVision.app" ]; then
            echo "OpenVision.app found!"
            du -sh build/Release-iphoneos/OpenVision.app
          else
            echo "OpenVision.app was not found in the expected location."
            echo ""
            echo "Searching for the application..."
            find . -name "OpenVision.app" -type d -print
            exit 1
          fi

      - name: Package IPA
        run: |
          set -e

          echo "======================================"
          echo "PACKAGING IPA"
          echo "======================================"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R \
            build/Release-iphoneos/OpenVision.app \
            build/Payload/OpenVision.app

          cd build

          rm -f OpenVision.ipa

          zip -r OpenVision.ipa Payload

          echo ""
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh OpenVision.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-IPA
          path: build/OpenVision.ipa
          if-no-files-found: error

      - name: Complete
        run: |
          echo ""
          echo "======================================"
          echo "BUILD COMPLETE"
          echo "======================================"
          echo "OpenVision.ipa has been created successfully."
